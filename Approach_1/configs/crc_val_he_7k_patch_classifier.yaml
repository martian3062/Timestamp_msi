experiment:
  name: crc_val_he_7k_patch_classifier
  training_mode: patch_classification
  seed: 310

data:
  dataset_path: E:\4basecare-MSI\datasets\CRC-VAL-HE-7K
  layout: folder_per_class
  image_extensions: [".tif", ".tiff"]
  classes: [ADI, BACK, DEB, LYM, MUC, MUS, NORM, STR, TUM]
  val_split: 0.20
  max_samples_per_class: null

model:
  backbone: resnet18
  use_pretrained: true
  image_size: 224
  output_dir: /data/patch_models

trainer:
  epochs: 10
  batch_size: 32
  learning_rate: 1.0e-4
  num_workers: 0

metrics:
  primary_metric: val_accuracy
  secondary_metrics: [val_f1_macro, val_auroc_ovr_macro]
