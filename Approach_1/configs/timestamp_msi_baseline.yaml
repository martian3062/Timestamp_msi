experiment:
  name: timestamp_msi_l4_baseline
  objective_metric: stable_score
  seed: 310

data:
  split_type: patient_level
  num_folds: 5
  stratify_by_label: true
  class_balance_strategy: weighted_loss

tiling:
  magnification: 20x
  tile_size: 256
  stride: 256
  tissue_threshold: 0.60
  max_tiles_per_slide: 2000
  save_tiles: false
  save_tile_index: true

feature_extraction:
  encoder_name: UNI
  input_size: 224
  batch_size: 32
  normalize_features: true
  feature_dtype: float16
  cache_features: true
  freeze_encoder: true

bagging:
  bag_size: 512
  bags_per_slide: 2
  bag_sampling: random
  tile_dropout: 0.10
  min_bag_size: 128

model:
  mil_type: gated_attention_mil
  hidden_dim: 512
  attention_dim: 256
  dropout: 0.25
  attention_dropout: 0.10
  classifier_dropout: 0.20
  pooling: attention
  use_layernorm: true

loss:
  name: weighted_cross_entropy
  class_weight_msi_h: 2.0
  class_weight_mss: 1.0
  label_smoothing: 0.05

optimizer:
  name: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  gradient_clip_val: 1.0

scheduler:
  name: cosine
  warmup_epochs: 3
  min_lr: 1.0e-6

trainer:
  max_epochs: 50
  batch_size: 2
  accumulate_grad_batches: 4
  precision: 16-mixed
  early_stopping_patience: 8
  monitor_metric: val_auroc

validation:
  threshold_method: youden_j
  bootstrap_samples: 1000
  confidence_level: 0.95
  calibration_method: temperature_scaling
  primary_metric: AUROC

monte_carlo:
  mc_dropout_enabled: true
  mc_dropout_rate: 0.20
  mc_samples: 50
  seed_values: [310, 42, 123, 2026, 777]
  bootstrap_ci_samples: 1000
  stable_best_penalty: 0.5

n8n:
  batch_size_svs: 10
  max_parallel_trials: 1
  status_poll_interval_min: 10
  cleanup_after_success: true
  cleanup_raw_svs: true
  minimum_free_storage_gb: 25
