<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L6,3 z" fill="#333"/>
</marker>
<style>
.title { font: 700 30px Arial, sans-serif; fill: #111; }
.box { fill: #f7f9fc; stroke: #3b4a5a; stroke-width: 2; }
.text { font: 600 22px Arial, sans-serif; fill: #1a1a1a; }
.sub { font: 400 16px Arial, sans-serif; fill: #444; }
.line { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
</style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="600.0" y="48" text-anchor="middle" class="title">High-Level Multimodal MSI Flowchart</text>
<rect class="box" x="240" y="90" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="126" text-anchor="middle" class="text">Inputs</text>
<text x="600.0" y="152" text-anchor="middle" class="sub">WSIs + omics + clinical metadata</text>
<rect class="box" x="240" y="225" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="261" text-anchor="middle" class="text">Image Pipeline</text>
<text x="600.0" y="287" text-anchor="middle" class="sub">Tiling, feature extraction, slide-level or bag-level embeddings</text>
<rect class="box" x="240" y="360" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="396" text-anchor="middle" class="text">Omics Pipeline</text>
<text x="600.0" y="422" text-anchor="middle" class="sub">Normalization, feature selection, pathway or gene-level representation</text>
<rect class="box" x="240" y="495" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="531" text-anchor="middle" class="text">Clinical Pipeline</text>
<text x="600.0" y="557" text-anchor="middle" class="sub">Clean metadata, encode variables, handle missing values</text>
<rect class="box" x="240" y="630" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="666" text-anchor="middle" class="text">Fusion Layer</text>
<text x="600.0" y="692" text-anchor="middle" class="sub">Early fusion, late fusion, or attention-based multimodal integration</text>
<rect class="box" x="240" y="765" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="801" text-anchor="middle" class="text">MSI Prediction</text>
<text x="600.0" y="827" text-anchor="middle" class="sub">Train multimodal classifier for MSI-H vs MSS</text>
<rect class="box" x="240" y="900" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="936" text-anchor="middle" class="text">Biology & Interpretation</text>
