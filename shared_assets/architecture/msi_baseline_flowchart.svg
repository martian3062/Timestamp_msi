<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L6,3 z" fill="#333"/>
</marker>
<style>
.title { font: 700 30px Arial, sans-serif; fill: #111; }
.box { fill: #f7f9fc; stroke: #3b4a5a; stroke-width: 2; }
.text { font: 600 22px Arial, sans-serif; fill: #1a1a1a; }
.sub { font: 400 16px Arial, sans-serif; fill: #444; }
.line { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
</style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<text x="600.0" y="48" text-anchor="middle" class="title">High-Level MSI Baseline Flowchart</text>
<rect class="box" x="240" y="90" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="126" text-anchor="middle" class="text">Input Data</text>
<text x="600.0" y="152" text-anchor="middle" class="sub">Raw WSIs, slide IDs, patient IDs, MSI labels</text>
<rect class="box" x="240" y="225" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="261" text-anchor="middle" class="text">Data Audit & Split</text>
<text x="600.0" y="287" text-anchor="middle" class="sub">QC checks and patient-level train/validation/test split</text>
<rect class="box" x="240" y="360" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="396" text-anchor="middle" class="text">Preprocessing</text>
<text x="600.0" y="422" text-anchor="middle" class="sub">Tissue detection, tiling, artifact filtering, normalization</text>
<rect class="box" x="240" y="495" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="531" text-anchor="middle" class="text">Slide Embeddings</text>
<text x="600.0" y="557" text-anchor="middle" class="sub">Extract one feature vector per slide</text>
<rect class="box" x="240" y="630" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="666" text-anchor="middle" class="text">Baseline Model</text>
<text x="600.0" y="692" text-anchor="middle" class="sub">Train linear probe / logistic regression for MSI-H vs MSS</text>
<rect class="box" x="240" y="765" rx="18" ry="18" width="720" height="90"/>
<text x="600.0" y="801" text-anchor="middle" class="text">Evaluation & Packaging</text>
<text x="600.0" y="827" text-anchor="middle" class="sub">AUROC, calibration, reports, saved model artifacts</text>
<line class="line" x1="600.0" y1="186" x2="600.0" y2="215"/>
<line class="line" x1="600.0" y1="321" x2="600.0" y2="350"/>
<line class="line" x1="600.0" y1="456" x2="600.0" y2="485"/>
<line class="line" x1="600.0" y1="591" x2="600.0" y2="620"/>
<line class="line" x1="600.0" y1="726" x2="600.0" y2="755"/>
</svg>