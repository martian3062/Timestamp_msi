version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: msi_user
      POSTGRES_PASSWORD: msi_password
      POSTGRES_DB: msi_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/app
      - ./data:/data  # Mount for slides and artifacts
    environment:
      - DATABASE_URL=postgresql://msi_user:msi_password@db:5432/msi_platform
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - db
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://msi_user:msi_password@db:5432/msi_platform --default-artifact-root /mlruns
    environment:
      - MLFLOW_TRACKING_URI=postgresql://msi_user:msi_password@db:5432/msi_platform
    depends_on:
      - db
    volumes:
      - mlflow_data:/mlruns

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    ports:
      - "6080:6080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - default

  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default

volumes:
  postgres_data:
  mlflow_data:
  n8n_data:
